<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 眼睛大幅度转动：思考时快速看向两边 */
    @keyframes move-eyes {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(12px, -12px) rotate(8deg); }   /* 往右上方看 */
      50% { transform: translate(14px, -8px) rotate(10deg); }   /* 停顿并略微下移 */
      75% { transform: translate(-10px, -10px) rotate(-6deg); } /* 快速转为向左上方看 */
    }

    /* 嘴巴更明显的撇嘴与缩放：配合眼睛方向移动 */
    @keyframes move-mouth {
      0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      25% { transform: translate(6px, -4px) scale(0.8) rotate(5deg); }   /* 向右撇嘴，明显变小 */
      50% { transform: translate(7px, -2px) scale(0.85) rotate(6deg); } 
      75% { transform: translate(-5px, -3px) scale(0.85) rotate(-4deg); } /* 向左撇嘴 */
    }

    /* 头发和面部轮廓微动：模拟思考时的“歪脖子” */
    @keyframes move-hair {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(2px, 1px) rotate(2deg); }    /* 微微向右歪头 */
      50% { transform: translate(2.5px, 0px) rotate(2.5deg); }
      75% { transform: translate(-1.5px, 1px) rotate(-1.5deg); } /* 微微向左歪头 */
    }

    .eye {
      animation: move-eyes 2s infinite ease-in-out;
      transform-origin: center;
      transform-box: fill-box;
    }

    .mouth {
      animation: move-mouth 2s infinite ease-in-out;
      transform-origin: center;
      transform-box: fill-box;
    }

    .hair {
      animation: move-hair 2s infinite ease-in-out;
      transform-origin: center;
      transform-box: fill-box;
    }
  </style>

